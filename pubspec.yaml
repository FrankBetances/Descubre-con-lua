name: descubre_con_lua
description: "Descubre con Lúa · Edición Vigo - Aplicación educativa offline para familias y docentes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/content/cuentos/
    - assets/content/laminas/
    - assets/content/english/
    - assets/content/corpus/
    - assets/content/unidades/
    - assets/content/capsulas/
    - assets/content/premios/

    # Los diez meses del curso y la guía de atención. Faltaba esta línea, y
    # como Flutter NO entra en los subdirectorios de una entrada, `meses.json`
    # no viajaba en el APK: el Calendario y la Guía se quedaban girando para
    # siempre. Lo vigila tools/check_bundled_assets.py.
    - assets/content/calendario/
    # El ritual de la asamblea: la consigna y los minutos de cada fase.
    - assets/content/asamblea/
    # La formación previa: lo que docente y familia tienen que saber ANTES
    # de usar la app. Los dos documentos curriculares la piden.
    - assets/content/formacion/
    # Las 20 microcápsulas del primer ciclo: 10 meses x 2 tramos (0-2 y 2-3).
    # Salen del documento curricular del primer ciclo, que describe una
    # dinámica distinta para cada tramo en cada mes.
    - assets/content/asambleas_primeiro_ciclo/
    # La progresión diaria: 4 semanas x 5 días por tramo. Es lo que hace
    # que la asamblea de hoy no sea la misma que la de ayer.
    - assets/content/progresion/
    # Las asambleas de segundo ciclo con el inglés como L3.
    - assets/content/asambleas_segundo_ciclo/
    # El contenido de «Aprender a Ler»: la mesa de letras, los cubos CVC y los
    # pares mínimos. Estaba escrito DENTRO del widget, que es justo lo que la
    # regla de producto prohíbe: 165 cadenas que ningún gate de contenido podía
    # mirar y que no podían tener audio.
    - assets/content/lectura/
    - assets/audio/
    # Las rejillas de Lúa. Hasta ahora solo las leía tools/build_launcher_icons.py
    # en tiempo de compilación, así que nunca se empaquetaron; en cuanto una
    # pantalla quiso pintarlas, la app se quedó sin ellas. Son la MISMA fuente
    # del icono y del splash: por eso se pintan desde aquí y no desde un PNG.
    - assets/brand/
    - assets/brand/logos/
    - assets/brand/awards/
    # Las láminas del contenido: una rejilla de 24×24 por objeto, misma paleta
    # que las insignias. Lo vigila tools/check_bundled_assets.py.
    - assets/brand/laminas/
    # Neural voice recordings (Celtia gl / Sharvard es / LJSpeech en),
    # synthesised at build time by tools/generate_voice_assets.py and
    # committed. The models never run on the device: la app lleva las
    # grabaciones y ningún motor de inferencia, y por eso el release no pide
    # permiso de red.
    #
    # Es, con diferencia, lo más pesado que lleva la app, y desde que las
    # 8.000 palabras del corpus suenan —cada una con su palabra y su frase—
    # es lo que decide el tamaño del paquete. El número medido está en
    # STATUS.md; aquí no, porque aquí se quedaría viejo.
    - assets/voice/
    # Nunito, en los cuatro pesos del sistema de diseño de la casa
    # (regular/semibold/bold/extrabold). Se empaquetan en
    # la app, no se piden por red: el APK no tiene permiso de INTERNET.
    - assets/fonts/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
